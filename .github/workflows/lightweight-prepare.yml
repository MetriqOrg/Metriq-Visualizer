name: Prepare lightweight runtime blobs

on:
  push:
    branches: [codex/visualizer-rendering-optimization]
    paths: [.github/workflows/lightweight-prepare.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'MetriqOrg/Metriq-Visualizer' && github.ref == 'refs/heads/codex/visualizer-rendering-optimization'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare eight tested source blobs without updating branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          expected_base = '83151d21325c76b18a3ebc4496a77164968ec6be'
          helper_path = '.github/workflows/lightweight-prepare.yml'
          subprocess.run(['git', 'merge-base', '--is-ancestor', expected_base, 'HEAD'], check=True)
          differences = subprocess.check_output(['git', 'diff', '--name-only', expected_base, 'HEAD'], text=True).splitlines()
          if differences != [helper_path]:
              raise SystemExit('Source changed; refusing to apply stale patch')
          api = 'https://api.github.com/repos/MetriqOrg/Metriq-Visualizer/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'Metriq-Visualizer-Lightweight-Pass'}
          def request(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, headers=headers, data=data, method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def git_blob_sha(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          chunks = []
          for sha in ['9fb3a24ff96459e6175cb0e41fe74090d0a8b726', '30fec8dae2ba76ce48d27b83939f54f8fb69e718', 'd87ad2ec49dd9dc59b1ade92f59ee6c6292c96fc', '8e881a289fd333681039c7a563e000651abdc39b']:
              response = request('git/blobs/' + sha)
              content = base64.b64decode(response['content'])
              if git_blob_sha(content) != sha:
                  raise SystemExit('Transport checksum mismatch')
              chunks.append(content)
          patch = gzip.decompress(base64.b64decode(b''.join(chunks), validate=True))
          expected_hash = '8a4d7a015477902fe1d538635beeaf37948a1c1409ebcd36add2862b043959ed'
          if hashlib.sha256(patch).hexdigest() != expected_hash:
              raise SystemExit('Patch checksum mismatch; no source changed')
          patch_path = Path('/tmp/lightweight-pass.patch')
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', str(patch_path)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          paths = ['PACKAGE_MANIFEST.json', 'docs/LIGHTWEIGHT_RUNTIME_PASS.md', 'metriq_visualizer_app.py', 'metriq_visualizer_panels.py', 'metriq_visualizer_realtime.py', 'metriq_visualizer_stage_output.py', 'tests/test_lightweight_runtime.py', 'tools/benchmark_lightweight.py']
          entries = []
          for name in paths:
              content = Path(name).read_bytes()
              blob_sha = git_blob_sha(content)
              uploaded = request('git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              if uploaded['sha'] != blob_sha:
                  raise SystemExit('Blob hash mismatch: ' + name)
              entries.append({'path': name, 'sha': blob_sha, 'sha256': hashlib.sha256(content).hexdigest()})
          record = {'base_sha': expected_base, 'helper_sha': os.environ['GITHUB_SHA'], 'patch_sha256': expected_hash, 'files': entries, 'branches_updated': False}
          Path('/tmp/prepared-lightweight-blobs.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-lightweight-blobs
          path: /tmp/prepared-lightweight-blobs.json
          retention-days: 1
          if-no-files-found: error
